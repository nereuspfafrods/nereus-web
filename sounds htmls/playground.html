<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>playground</title>
    <style>
      body {
        position: relative;
        width: 100vw;
        height: 100vh;
        margin: 0;
        overflow: hidden;
        background: #1f1f1f;
      }

      img {
        position: absolute;
        width: 100px;
        height: 100px;
        object-fit: contain;
        border-radius: 12px;
        box-shadow: 0 0 12px rgba(0, 0, 0, 0.4);
        user-select: none;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <img src="" alt="Random QR" />
    <script>
      const img = document.querySelector("img");

      function placeRandomImage() {
        const x = Math.random() * (window.innerWidth - 120);
        const y = Math.random() * (window.innerHeight - 120);
        const randomSrc = qrImages[Math.floor(Math.random() * qrImages.length)];

        img.src = randomSrc;
        img.style.left = `${x}px`;
        img.style.top = `${y}px`;
      }

      placeRandomImage();
      setInterval(placeRandomImage, 1000);
    </script>
  </body>
</html>
