<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>Sound</h1>
    <script>
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      const audio_cxt = AudioCtx ? new AudioCtx() : null;
      let soundStarted = false;

      function playSound() {
        if (!audio_cxt) return;

        const oscillator = audio_cxt.createOscillator();
        const gainNode = audio_cxt.createGain();

        oscillator.type = "sine";
        oscillator.frequency.setValueAtTime(150, audio_cxt.currentTime);

        gainNode.gain.setValueAtTime(0.001, audio_cxt.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(
          0.2,
          audio_cxt.currentTime + 0.1,
        );
        gainNode.gain.exponentialRampToValueAtTime(
          0.0001,
          audio_cxt.currentTime + 100,
        );

        oscillator.connect(gainNode);
        gainNode.connect(audio_cxt.destination);
        oscillator.start();
        oscillator.stop(audio_cxt.currentTime + 10);
      }

      async function startSound() {
        if (!audio_cxt || soundStarted) return;

        try {
          if (audio_cxt.state === "suspended") {
            await audio_cxt.resume();
          }
        } catch (error) {
          if (audio_cxt.state !== "suspended") {
            throw error;
          }
        }

        if (audio_cxt.state !== "running") return;
        soundStarted = true;
        playSound();
        window.removeEventListener("pointerdown", startAfterInteraction);
        window.removeEventListener("keydown", startAfterInteraction);
      }

      function startAfterInteraction() {
        startSound().catch((error) =>
          console.error("Could not play sound:", error),
        );
      }

      window.addEventListener("load", () => {
        startSound().catch((error) =>
          console.error("Could not play sound:", error),
        );
      });
      window.addEventListener("pointerdown", startAfterInteraction);
      window.addEventListener("keydown", startAfterInteraction);
    </script>
  </body>
</html>
