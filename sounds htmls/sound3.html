<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>Sound</h1>
    <script>
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      const audio_cxt = AudioCtx ? new AudioCtx() : null;

      function playSound() {
        if (!audio_cxt) return;

        const oscillator = audio_cxt.createOscillator();
        const gainNode = audio_cxt.createGain();

        oscillator.type = "sine";
        oscillator.frequency.setValueAtTime(600, audio_cxt.currentTime);

        gainNode.gain.setValueAtTime(0.1, audio_cxt.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(
          0.2,
          audio_cxt.currentTime + 0.05,
        );
        gainNode.gain.exponentialRampToValueAtTime(
          0.0001,
          audio_cxt.currentTime + 0.3,
        );

        oscillator.connect(gainNode);
        gainNode.connect(audio_cxt.destination);
        oscillator.start();
        oscillator.stop(audio_cxt.currentTime + 0.35);
      }

      window.addEventListener("load", async () => {
        if (audio_cxt && audio_cxt.state === "suspended") {
          await audio_cxt.resume();
        }

        playSound();
        setInterval(playSound, 600);
      });
    </script>
  </body>
</html>
